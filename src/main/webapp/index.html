<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Testando Servlets</title>
</head>
<body>
	<h1>Selecione uma opção</h1>
	<br>
	<ul>
		
		<li><a href="headers">Headers</a></li> <!-- "/Explorando-Servlets/headers" faz a mesma coisa -->
		<li><a href="form.jsp">RequestBody</a></li>
		<li><a href="session?status=Autorizado">Realizar Login</a> ou <a href="session">Entrar</a></li>
		<li><a href="status?code=200">200</a> <a href="status?code=201">201</a> <a href="status?code=404">404</a> <a href="status?code=500">500</a></li>
		<li><a href="methods">Methods</a></li>
	</ul>
	
	<script>
		function listar(){
			fetch('methods', {method: 'OPTIONS'}).then(r => alert(r.headers.get('Allow')))
		}
		
		window.onload = function(){
			const params = 	new URLSearchParams(window.location.search);
			
			if (params.get("executar") === "true"){
				listar();
				window.history.replaceState({}, document.title, window.location.pathname);
			}
		};
	</script>
</body>
</html>
